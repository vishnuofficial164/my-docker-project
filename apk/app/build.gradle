plugins {
    id "com.android.application"
}

android {
    namespace "com.z10r.camera"
    compileSdk 34

    defaultConfig {
        applicationId "com.z10r.camera"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("keystore/z10r-camera.keystore")
            storePassword System.getenv("KS_PASS") ?: "z10rcamera"
            keyAlias "z10rcamera"
            keyPassword System.getenv("KS_PASS") ?: "z10rcamera"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.webkit:webkit:1.10.0"
}
